<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src {{cspSource}} data:; style-src {{cspSource}} 'unsafe-inline'; script-src {{cspSource}} 'nonce-{{nonce}}';">
    <title>Search Results</title>    <style>
        body {
            padding: 10px;
            font-family: var(--vscode-font-family);
            font-size: var(--vscode-font-size);
            color: var(--vscode-foreground, #cccccc);
            background: var(--vscode-sideBar-background, #1e1e1e);
        }        .search-container {
            margin-bottom: 10px;
            padding: 4px 0;
        }
        .search-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .search-input-wrap {
            position: relative;
            flex: 1;
            min-width: 0;
        }
        #search-input {
            width: 100%;
            box-sizing: border-box;
            padding: 6px 28px 6px 8px;
            border: 1px solid var(--vscode-input-border);
            background-color: var(--vscode-input-background);
            color: var(--vscode-input-foreground);
            border-radius: 2px;
            outline: none;
        }
        #search-input:focus {
            border-color: var(--vscode-focusBorder);
        }
        .history-btn {
            position: absolute;
            right: 1px;
            top: 1px;
            bottom: 1px;
            width: 24px;
            padding: 0;
            border: none;
            border-radius: 2px;
            background: transparent;
            color: var(--vscode-input-foreground);
            cursor: pointer;
        }
        .history-btn:hover {
            background: var(--vscode-toolbar-hoverBackground);
        }
        .history-dropdown {
            position: absolute;
            left: 0;
            right: 0;
            top: 100%;
            margin-top: 2px;
            max-height: 240px;
            overflow-y: auto;
            z-index: 20;
            background: var(--vscode-dropdown-background, var(--vscode-editor-background));
            border: 1px solid var(--vscode-dropdown-border, var(--vscode-widget-border));
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
        }
        .history-item {
            padding: 4px 8px;
            cursor: pointer;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .history-item:hover {
            background: var(--vscode-list-hoverBackground);
        }
        .history-empty {
            padding: 6px 8px;
            color: var(--vscode-descriptionForeground);
        }
        .search-container .controls {
            display: flex;
            gap: 4px;
        }
        .dir-group {
            margin-bottom: 1px;
        }
        .dir-header {
            padding: 4px 8px;
            cursor: pointer;
            background-color: rgba(22, 130, 214, 0.2);
            border-radius: 4px;
            font-weight: bold;
            display: flex;
            align-items: center;
            color: var(--vscode-sideBarTitle-foreground);
        }
        .dir-header:hover {
            background-color: var(--vscode-list-hoverBackground);
        }
        .dir-header .collapse-icon {
            margin-right: 4px;
            transition: transform 0.2s;
        }
        .dir-header.collapsed .collapse-icon {
            transform: rotate(-90deg);
        }
        .dir-path {
            color: var(--vscode-editor-foreground);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .result-list {
            margin-left: 15px;
            transition: height 0.2s ease;
        }
        .result-list.collapsed {
            display: none;
        }
        .result-item {
            padding: 2px 4px;
            cursor: pointer;
            font-family: var(--vscode-editor-font-family);
            display: flex;
            align-items: baseline;
            /* 文件、行号、函数、行内容之间只用 2 个空格的间距 */
            gap: 2ch;
            line-height: 1.5;
            white-space: nowrap;
        }
        .result-item:hover {
            background-color: var(--vscode-list-hoverBackground);
        }
        .result-item.selected {
            background-color: var(--vscode-list-activeSelectionBackground);
            color: var(--vscode-list-activeSelectionForeground);
        }
        .result-item.selected .line-content {
            color: var(--vscode-list-activeSelectionForeground);
        }
        .result-location {
            flex: 0 1 auto;
            display: flex;
            align-items: baseline;
            min-width: 0;
            overflow: hidden;
        }
        .result-file-name {
            flex: 0 1 auto;
            color: var(--vscode-charts-orange, orange);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .result-line-number {
            flex: 0 0 auto;
            color: var(--vscode-editorLineNumber-foreground);
        }
        .result-function {
            flex: 0 1 auto;
            min-width: 0;
            color: var(--vscode-textLink-foreground);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .result-function.empty {
            color: var(--vscode-disabledForeground);
        }
        .line-content {
            flex: 1;
            min-width: 0;
            color: var(--vscode-editor-foreground);
            opacity: 1;
            /* 行首缩进已由扩展侧过滤，这里只负责不换行与超出显示省略号 */
            white-space: pre;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .highlight-read, .highlight-write, .highlight-call {
            white-space: nowrap;
            display: inline-block;
            border-radius: 2px;
        }
        .results-empty {
            padding: 8px;
            color: var(--vscode-descriptionForeground);
        }
        .summary {
            margin-bottom: 12px;
            padding: 8px;
            background-color: var(--vscode-editor-background);
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .controls {
            display: flex;
            gap: 8px;
        }
        .control-button {
            padding: 4px 8px;
            color: var(--vscode-button-foreground);
            border: none;
            border-radius: 2px;
            cursor: pointer;
            display: flex;
            align-items: center;
            font-size: 12px;
            background: var(--vscode-button-secondaryBackground);
        }
        .control-button.active {
            background: var(--vscode-button-background);
        }        .control-button:hover {
            background: var(--vscode-button-background);
        }

        /* 右键菜单样式 */
        .context-menu {
            position: absolute;
            background-color: var(--vscode-menu-background);
            border: 1px solid var(--vscode-menu-border);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            padding: 4px 0;
            z-index: 1000;
            border-radius: 3px;
        }
        .context-menu-item {
            padding: 6px 12px;
            cursor: pointer;
            white-space: nowrap;
            color: var(--vscode-menu-foreground);
            font-size: 13px;
        }
        .context-menu-item:hover {
            background-color: var(--vscode-list-hoverBackground);
        }
    </style>
</head>
<body>    <div class="summary" id="summary">
        <div id="summary-text">选中一个词，按 Ctrl+Shift+F 搜索</div>
    </div>
    <div class="search-container" id="search-container">
        <div class="search-row">
            <div class="search-input-wrap">
                <input type="text" id="search-input" placeholder="输入搜索内容..." />
                <button type="button" class="history-btn" id="history-btn" title="搜索历史" aria-expanded="false">▼</button>
                <div id="history-dropdown" class="history-dropdown" hidden></div>
            </div>
            <div class="controls">
                <button class="control-button" id="caseSensitiveBtn" title="区分大小写">Aa</button>
                <button class="control-button" id="wholeWordBtn" title="全词匹配">\\b</button>
            </div>
        </div>
    </div>    <div id="results"></div>    <div id="context-menu" class="context-menu" style="display: none;">
        <div class="context-menu-item" id="collapse-all">折叠全部</div>
        <div class="context-menu-item" id="filter-file-ext">过滤文件类型</div>
        <div class="context-menu-item" id="copy-file-name">复制文件名</div>
        <div class="context-menu-item" id="copy-file-path">复制文件路径</div>
        <div class="context-menu-item" id="open-in-explorer">在资源管理器中打开</div>
    </div>    <script nonce="{{nonce}}">
        (function() {
            window.addEventListener('error', (event) => {
                const summary = document.getElementById('summary-text');
                if (summary) {
                    summary.textContent = '结果页出错：' + (event.message || '未知错误');
                }
            });
            const vscode = acquireVsCodeApi();
            const path = {
                basename: function(filePath) {
                    return filePath.replace(/^.*[\\\/]/, '');
                },
                dirname: function(filePath) {
                    return filePath.replace(/[\\\/][^\\\/]*$/, '');
                }
            };

            // HTML 转义，避免代码内容中的特殊字符被当作标签解析
            function escapeHtml(text) {
                return String(text === undefined || text === null ? '' : text)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#39;');
            }
            // 默认高亮颜色，同时作为非法颜色配置的回退值
            const DEFAULT_COLORS = {
                read: 'rgba(64, 200, 64, 0.2)',
                write: 'rgba(240, 64, 64, 0.2)',
                call: 'rgba(184, 78, 0, 0.55)'
            };
            let currentColors = { ...DEFAULT_COLORS };
            let searchOptions = {
                caseSensitive: true,
                matchWholeWord: true
            };
            let currentSelectedItem = null;
            let colorsStyleEl = null;
            // 当前搜索序号，用于识别新的一次搜索
            let currentSearchId = null;
            // 已渲染结果的定位键，增量追加时用来去重
            let renderedKeys = new Set();
            // 目录路径 -> 该目录下的结果列表节点
            let groupElements = new Map();
            let renderedTotal = 0;
            let renderedWriteCount = 0;
            let renderedCallCount = 0;

            // 只接受合法的 CSS 颜色，避免配置里的内容被当作样式注入
            function safeColor(value, fallback) {
                if (typeof value !== 'string' || !value.trim()) {
                    return fallback;
                }
                try {
                    if (window.CSS && typeof window.CSS.supports === 'function' && window.CSS.supports('color', value)) {
                        return value;
                    }
                } catch {
                    return fallback;
                }
                return fallback;
            }

            // 更新样式（复用同一个 style 节点，避免每次推送都新增节点）
            function updateColors(colors) {
                if (!colorsStyleEl) {
                    colorsStyleEl = document.createElement('style');
                    document.head.appendChild(colorsStyleEl);
                }
                currentColors = {
                    read: safeColor(colors.read, DEFAULT_COLORS.read),
                    write: safeColor(colors.write, DEFAULT_COLORS.write),
                    call: safeColor(colors.call, DEFAULT_COLORS.call)
                };
                colorsStyleEl.textContent = `
                    .highlight-read {
                        background-color: ${currentColors.read};
                    }
                    .highlight-write {
                        background-color: ${currentColors.write};
                    }
                    .highlight-call {
                        background-color: ${currentColors.call};
                    }
                `;
            }

            // 更新按钮状态
            function updateButtonStates() {
                const caseSensitiveBtn = document.getElementById('caseSensitiveBtn');
                const wholeWordBtn = document.getElementById('wholeWordBtn');

                if (searchOptions.caseSensitive) {
                    caseSensitiveBtn.classList.add('active');
                } else {
                    caseSensitiveBtn.classList.remove('active');
                }

                if (searchOptions.matchWholeWord) {
                    wholeWordBtn.classList.add('active');
                } else {
                    wholeWordBtn.classList.remove('active');
                }
            }

            // 右键菜单当前作用的目标，可能是目录头或结果行
            let contextMenuTarget = null;

            // 根据目标类型显示或隐藏菜单项
            function updateContextMenuItems(targetType) {
                const visibility = {
                    'collapse-all': targetType === 'dir',
                    'filter-file-ext': targetType === 'file',
                    'copy-file-name': targetType === 'file',
                    'copy-file-path': true,
                    'open-in-explorer': true
                };
                Object.keys(visibility).forEach(id => {
                    document.getElementById(id).style.display = visibility[id] ? '' : 'none';
                });
            }

            // 处理点击事件
            document.addEventListener('click', (e) => {
                // 点到搜索框外面时收起历史列表
                if (!e.target.closest('.search-input-wrap')) {
                    setHistoryOpen(false);
                }
                // 隐藏右键菜单
                document.getElementById('context-menu').style.display = 'none';

                const dirHeader = e.target.closest('.dir-header');
                if (dirHeader) {
                    // 处理目录组的折叠/展开
                    dirHeader.classList.toggle('collapsed');
                    const resultList = dirHeader.nextElementSibling;
                    if (resultList) {
                        resultList.classList.toggle('collapsed');
                    }
                    return;
                }

                const resultItem = e.target.closest('.result-item');
                if (resultItem) {
                    // 清除之前的选中状态
                    if (currentSelectedItem) {
                        currentSelectedItem.classList.remove('selected');
                    }

                    // 设置新的选中状态
                    resultItem.classList.add('selected');
                    currentSelectedItem = resultItem;

                    const { file, line } = resultItem.dataset;
                    vscode.postMessage({
                        type: 'jump',
                        file: file,
                        line: parseInt(line, 10)
                    });
                }
            });

            // 处理右键菜单
            document.addEventListener('contextmenu', (e) => {
                const dirHeader = e.target.closest('.dir-header');
                const resultItem = e.target.closest('.result-item');
                if (!dirHeader && !resultItem) {
                    // 右键非结果区域时收起菜单
                    document.getElementById('context-menu').style.display = 'none';
                    return;
                }

                e.preventDefault(); // 阻止默认右键菜单

                if (resultItem) {
                    // 右键结果行：对具体文件操作
                    contextMenuTarget = {
                        type: 'file',
                        fullPath: resultItem.dataset.file
                    };
                } else {
                    // 右键目录头：对目录操作
                    contextMenuTarget = {
                        type: 'dir',
                        fullPath: dirHeader.querySelector('.dir-path').textContent
                    };
                }
                updateContextMenuItems(contextMenuTarget.type);

                // 显示右键菜单
                const menu = document.getElementById('context-menu');
                menu.style.display = 'block';

                // 避免菜单超出可视区域
                const menuRect = menu.getBoundingClientRect();
                const maxLeft = window.scrollX + document.documentElement.clientWidth - menuRect.width;
                const maxTop = window.scrollY + document.documentElement.clientHeight - menuRect.height;
                menu.style.left = Math.max(window.scrollX, Math.min(e.pageX, maxLeft)) + 'px';
                menu.style.top = Math.max(window.scrollY, Math.min(e.pageY, maxTop)) + 'px';
            });

            // 处理菜单项点击
            document.getElementById('collapse-all').addEventListener('click', () => {
                // 折叠所有目录组
                const dirHeaders = document.querySelectorAll('.dir-header');
                dirHeaders.forEach(header => {
                    header.classList.add('collapsed');
                    const resultList = header.nextElementSibling;
                    if (resultList) {
                        resultList.classList.add('collapsed');
                    }
                });
                // 隐藏右键菜单
                document.getElementById('context-menu').style.display = 'none';
            });

            // 处理菜单项点击
            document.getElementById('filter-file-ext').addEventListener('click', () => {
                if (contextMenuTarget && contextMenuTarget.type === 'file') {
                    // 获取文件扩展名
                    const fileExt = contextMenuTarget.fullPath.split('.').pop();
                    if (fileExt) {
                        // 发送消息到扩展以添加到过滤列表
                        vscode.postMessage({
                            type: 'addFileExtFilter',
                            extension: '.' + fileExt
                        });
                    }
                }
                // 隐藏右键菜单
                document.getElementById('context-menu').style.display = 'none';
            });

            // 复制文件名
            document.getElementById('copy-file-name').addEventListener('click', () => {
                if (contextMenuTarget && contextMenuTarget.type === 'file') {
                    const fileName = path.basename(contextMenuTarget.fullPath);
                    vscode.postMessage({
                        type: 'copyToClipboard',
                        text: fileName
                    });
                }
                // 隐藏右键菜单
                document.getElementById('context-menu').style.display = 'none';
            });

            // 复制文件路径
            document.getElementById('copy-file-path').addEventListener('click', () => {
                if (contextMenuTarget) {
                    vscode.postMessage({
                        type: 'copyToClipboard',
                        text: contextMenuTarget.fullPath
                    });
                }
                // 隐藏右键菜单
                document.getElementById('context-menu').style.display = 'none';
            });

            // 在资源管理器中打开
            document.getElementById('open-in-explorer').addEventListener('click', () => {
                if (contextMenuTarget) {
                    vscode.postMessage({
                        type: 'openInExplorer',
                        filePath: contextMenuTarget.fullPath
                    });
                }
                // 隐藏右键菜单
                document.getElementById('context-menu').style.display = 'none';
            });

            // 搜索历史：最近的在最前面，由扩展侧保存并推送
            let searchHistory = [];

            function setHistoryOpen(open) {
                document.getElementById('history-dropdown').hidden = !open;
                document.getElementById('history-btn').setAttribute('aria-expanded', open ? 'true' : 'false');
            }

            function renderHistory() {
                const dropdown = document.getElementById('history-dropdown');
                dropdown.innerHTML = '';
                if (searchHistory.length === 0) {
                    const empty = document.createElement('div');
                    empty.className = 'history-empty';
                    empty.textContent = '还没有搜索记录';
                    dropdown.appendChild(empty);
                    return;
                }
                searchHistory.forEach(text => {
                    const item = document.createElement('div');
                    item.className = 'history-item';
                    item.textContent = text;
                    item.title = text;
                    item.addEventListener('click', () => runSearch(text));
                    dropdown.appendChild(item);
                });
            }

            function runSearch(text) {
                const searchText = String(text || '').trim();
                if (!searchText) {
                    return;
                }
                document.getElementById('search-input').value = searchText;
                setHistoryOpen(false);
                vscode.postMessage({
                    type: 'search',
                    text: searchText
                });
            }

            // 处理搜索输入框事件
            document.getElementById('search-input').addEventListener('keyup', (e) => {
                if (e.key === 'Enter') {
                    runSearch(e.target.value);
                } else if (e.key === 'Escape') {
                    setHistoryOpen(false);
                }
            });

            document.getElementById('history-btn').addEventListener('click', () => {
                const dropdown = document.getElementById('history-dropdown');
                setHistoryOpen(dropdown.hidden);
            });

            // 处理按钮点击事件
            document.getElementById('caseSensitiveBtn').addEventListener('click', () => {
                const newValue = !searchOptions.caseSensitive;
                searchOptions.caseSensitive = newValue; // 先更新本地状态
                updateButtonStates(); // 然后更新按钮视觉状态
                // 最后发送配置更新消息
                vscode.postMessage({
                    type: 'updateOption',
                    option: 'caseSensitive',
                    value: newValue
                });
            });

            document.getElementById('wholeWordBtn').addEventListener('click', () => {
                const newValue = !searchOptions.matchWholeWord;
                searchOptions.matchWholeWord = newValue; // 先更新本地状态
                updateButtonStates(); // 然后更新按钮视觉状态
                // 最后发送配置更新消息
                vscode.postMessage({
                    type: 'updateOption',
                    option: 'matchWholeWord',
                    value: newValue
                });
            });

            // 处理来自扩展的消息
            window.addEventListener('message', event => {
                const message = event.data;
                switch (message.type) {
                    case 'searching':
                        if (message.searchId !== currentSearchId) {
                            currentSearchId = message.searchId;
                            resetResults();
                        }
                        if (message.searchText) {
                            document.getElementById('search-input').value = message.searchText;
                        }
                        document.getElementById('summary-text').textContent = '正在搜索…';
                        break;
                    case 'results':
                        if (message.colors) {
                            currentColors = message.colors;
                            updateColors(currentColors);
                        }
                        if (message.searchOptions) {
                            searchOptions = message.searchOptions;
                            updateButtonStates();
                        }
                        if (message.searchText) {
                            document.getElementById('search-input').value = message.searchText;
                        }
                        // 新的一次搜索先清掉上次的结果，避免新旧结果混在一起
                        if (message.searchId !== currentSearchId) {
                            currentSearchId = message.searchId;
                            resetResults();
                        }
                        updateResults(message.results, message.mode || 'final');
                        break;
                    case 'focusSearch':
                        document.getElementById('search-input').focus();
                        break;
                    case 'searchHistory':
                        searchHistory = Array.isArray(message.history) ? message.history : [];
                        renderHistory();
                        // 新搜索一开始就会更新历史，这时结果可能还没到，先把列表收起
                        setHistoryOpen(false);
                        break;
                }
            });

            // 页面准备好后再要历史，避免消息比监听更早到达
            vscode.postMessage({ type: 'ready' });

            // 初始化默认颜色
            updateColors(currentColors);

            // 清空结果，重置增量渲染状态
            function resetResults() {
                document.getElementById('results').innerHTML = '';
                renderedKeys = new Set();
                groupElements = new Map();
                renderedTotal = 0;
                renderedWriteCount = 0;
                renderedCallCount = 0;
                currentSelectedItem = null;
            }

            function updateSummary(total, writeCount, callCount) {
                const readCount = total - writeCount - callCount;
                const callPart = callCount > 0 ? `，${callCount} 处函数调用` : '';
                document.getElementById('summary-text').textContent =
                    `找到 ${total} 处匹配：${readCount} 处读操作，${writeCount} 处写操作${callPart}`;
            }

            // 生成单条结果的 HTML
            function renderItemHtml(result) {
                const line = result.lineContent;
                const highlightClass = result.isWrite
                    ? 'highlight-write'
                    : (result.isCall ? 'highlight-call' : 'highlight-read');

                // 创建带有高亮的行内容
                const matchStart = result.matchStart === undefined ? 0 : result.matchStart;
                const matchEnd = result.matchEnd === undefined ? matchStart : result.matchEnd;
                const highlightedLine =
                    escapeHtml(line.substring(0, matchStart)) +
                    `<span class="${highlightClass}">${escapeHtml(line.substring(matchStart, matchEnd))}</span>` +
                    escapeHtml(line.substring(matchEnd));

                const functionName = result.functionName || '-';
                const functionClass = result.functionName ? 'result-function' : 'result-function empty';
                // 取不到函数名时说明原因（没有符号提供者、命中文件过多等）
                const functionTitle = result.functionName || result.functionNameHint || '';

                return `
                    <div class="result-item" data-file="${escapeHtml(result.file)}" data-file-name="${escapeHtml(result.fileName)}" data-line="${result.line}">
                        <span class="result-location">
                            <span class="result-file-name" title="${escapeHtml(result.file)}">${escapeHtml(result.fileName)}</span><span class="result-line-number">:${result.line + 1}</span>
                        </span>
                        <span class="${functionClass}" title="${escapeHtml(functionTitle)}">${escapeHtml(functionName)}</span>
                        <span class="line-content" title="${escapeHtml(line)}">${highlightedLine}</span>
                    </div>
                `;
            }

            // 按需创建目录分组节点
            function ensureGroup(dir) {
                let group = groupElements.get(dir);
                if (group) {
                    return group;
                }

                const groupEl = document.createElement('div');
                groupEl.className = 'dir-group';

                const header = document.createElement('div');
                header.className = 'dir-header';
                const icon = document.createElement('span');
                icon.className = 'collapse-icon';
                icon.textContent = '▼';
                const dirPath = document.createElement('span');
                dirPath.className = 'dir-path';
                dirPath.textContent = dir;
                dirPath.title = dir;
                header.appendChild(icon);
                header.appendChild(dirPath);

                const list = document.createElement('div');
                list.className = 'result-list';

                groupEl.appendChild(header);
                groupEl.appendChild(list);
                document.getElementById('results').appendChild(groupEl);

                group = { list };
                groupElements.set(dir, group);
                return group;
            }

            function compareResultItems(a, b) {
                const nameCompare = a.dataset.fileName.localeCompare(b.dataset.fileName);
                return nameCompare !== 0 ? nameCompare : Number(a.dataset.line) - Number(b.dataset.line);
            }

            // 目录内按文件名、行号升序。已经有序时不再搬动节点
            function sortGroup(list) {
                const items = Array.from(list.children);
                for (let i = 1; i < items.length; i++) {
                    if (compareResultItems(items[i - 1], items[i]) > 0) {
                        items.sort(compareResultItems);
                        // appendChild 移动的是已有节点，不会丢失节点上的状态
                        items.forEach(item => list.appendChild(item));
                        return;
                    }
                }
            }

            // 追加渲染新结果，已经在视图里的结果会被跳过
            function appendResults(results) {
                if (!results || results.length === 0) {
                    return;
                }

                const pendingHtml = new Map();
                for (const result of results) {
                    const key = result.file + ':' + result.line;
                    if (renderedKeys.has(key)) {
                        continue;
                    }
                    renderedKeys.add(key);
                    renderedTotal++;
                    if (result.isWrite) {
                        renderedWriteCount++;
                    } else if (result.isCall) {
                        renderedCallCount++;
                    }

                    const dir = path.dirname(result.file);
                    pendingHtml.set(dir, (pendingHtml.get(dir) || '') + renderItemHtml(result));
                }

                for (const [dir, html] of pendingHtml) {
                    const group = ensureGroup(dir);
                    group.list.insertAdjacentHTML('beforeend', html);
                    // 新结果可能插在中间，排序一次保证顺序正确
                    sortGroup(group.list);
                }
            }

            // 记录整体刷新前需要保留的视图状态
            function captureViewState() {
                const collapsedDirs = new Set();
                document.querySelectorAll('.dir-header.collapsed').forEach(header => {
                    const dirPath = header.querySelector('.dir-path');
                    if (dirPath) {
                        collapsedDirs.add(dirPath.textContent);
                    }
                });
                return {
                    collapsedDirs,
                    selectedKey: currentSelectedItem
                        ? currentSelectedItem.dataset.file + ':' + currentSelectedItem.dataset.line
                        : null,
                    scrollTop: document.documentElement.scrollTop || document.body.scrollTop || 0
                };
            }

            // 更新搜索结果显示：增量消息只追加，最终消息整体刷新
            function updateResults(results, mode) {
                if (mode !== 'final') {
                    appendResults(results);
                    // 总数和写操作数都按已经画出来的结果算，过渡期两边才对得上
                    updateSummary(renderedTotal, renderedWriteCount, renderedCallCount);
                    return;
                }

                // 整体刷新会重建 DOM，先记录需要保留的视图状态
                const state = captureViewState();
                resetResults();
                appendResults(results);
                updateSummary(renderedTotal, renderedWriteCount, renderedCallCount);
                if (renderedTotal === 0) {
                    const empty = document.createElement('div');
                    empty.className = 'results-empty';
                    empty.textContent = '没有找到匹配';
                    document.getElementById('results').appendChild(empty);
                }

                // 恢复折叠状态
                document.querySelectorAll('.dir-group').forEach(group => {
                    const header = group.querySelector('.dir-header');
                    const dirPath = header ? header.querySelector('.dir-path') : null;
                    if (!header || !dirPath || !state.collapsedDirs.has(dirPath.textContent)) {
                        return;
                    }
                    header.classList.add('collapsed');
                    const resultList = header.nextElementSibling;
                    if (resultList) {
                        resultList.classList.add('collapsed');
                    }
                });

                // 恢复选中项
                if (state.selectedKey) {
                    for (const item of document.querySelectorAll('.result-item')) {
                        if (item.dataset.file + ':' + item.dataset.line === state.selectedKey) {
                            item.classList.add('selected');
                            currentSelectedItem = item;
                            break;
                        }
                    }
                }

                // 恢复滚动位置，避免整体刷新时视图跳回顶部
                if (state.scrollTop > 0) {
                    document.documentElement.scrollTop = state.scrollTop;
                    document.body.scrollTop = state.scrollTop;
                }
            }
        }())
    </script>
</body>
</html>
